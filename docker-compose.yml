name: aipeer

services:
  # =========================================================================
  # 1. Express API Backend (Cloud Run local emulation)
  # =========================================================================
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: aipeer-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: ./API/.env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=8080

  # =========================================================================
  # 2. Android App Compilation Container (React Native / Expo bare)
  # =========================================================================
  android-builder:
    build:
      context: ./front-end/AI-PEER
      dockerfile: Dockerfile.android
    container_name: aipeer-android-builder
    working_dir: /app
    volumes:
      # Mount project source
      - ./front-end/AI-PEER:/app
      # Persist Gradle cache between builds to prevent re-downloading dependencies
      - gradle-cache:/root/.gradle
      # Export compiled APKs to host
      - ./build-output:/output
    environment:
      - GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m" -Dorg.gradle.workers.max=2
      - REACT_NATIVE_ARCHITECTURES=arm64-v8a
      - CMAKE_BUILD_PARALLEL_LEVEL=2
    # Default command builds debug APK and copies to mounted /output directory
    command: >
      bash -c "if [ ! -f android/app/debug.keystore ]; then keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'; fi && npm ci && cd android && sed -i 's/\r$//' gradlew && chmod +x gradlew && ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --max-workers=2 && mkdir -p /output && cp app/build/outputs/apk/debug/app-debug.apk /output/app-debug.apk && echo '===> Build successful! APK ready at build-output/app-debug.apk'"

volumes:
  gradle-cache:
    name: aipeer-gradle-cache
